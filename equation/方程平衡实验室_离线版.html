<script id="engine-inline">
(() => {
  'use strict';
  const fail = message => { throw new Error(message); };
  const abs = n => n < 0n ? -n : n;
  const gcd = (a,b) => { a=abs(a);b=abs(b);while(b){[a,b]=[b,a%b];}return a||1n; };
  function fraction(n,d=1n) {
    if(!d) fail('不能除以0。');
    if(d<0n){n=-n;d=-d;}const g=gcd(n,d);n/=g;d/=g;
    if(abs(n).toString().length>80 || d.toString().length>80) fail('数值过大，请使用本章范围内的数字。');
    return {n,d};
  }
  function rat(value) {
    if(value&&typeof value.n==='bigint') return fraction(value.n,value.d);
    const s=String(value).trim().replace(/[−－]/g,'-');
    if(s.length>32) fail('数字太长。');
    if(s.includes('/')){const p=s.split('/');if(p.length!==2)fail('分数格式不正确。');return div(rat(p[0]),rat(p[1]));}
    if(!/^[+-]?(?:\d+(?:\.\d{1,8})?|\.\d{1,8})$/.test(s))fail('请输入整数、小数或分数，例如 -2/3。');
    const [whole,tail='']=s.replace(/^[+-]/,'').split('.');return fraction(BigInt((whole||'0')+tail)*(s[0]==='-'?-1n:1n),10n**BigInt(tail.length));
  }
  const add=(a,b)=>fraction(a.n*b.d+b.n*a.d,a.d*b.d);
  const neg=a=>fraction(-a.n,a.d);
  const sub=(a,b)=>add(a,neg(b));
  const mul=(a,b)=>fraction(a.n*b.n,a.d*b.d);
  const div=(a,b)=>fraction(a.n*b.d,a.d*b.n);
  const eq=(a,b)=>a.n===b.n&&a.d===b.d;
  const str=a=>a.d===1n?String(a.n):a.n+'/'+a.d;
  const Z=rat(0),O=rat(1);
  const poly=(a=Z,b=Z)=>({a,b});
  const plus=(p,q)=>poly(add(p.a,q.a),add(p.b,q.b));
  const scale=(p,r)=>poly(mul(p.a,r),mul(p.b,r));
  const same=(p,q)=>eq(p.a,q.a)&&eq(p.b,q.b);
  function parse(source) {
    const s=String(source).trim().replace(/[−－]/g,'-').replace(/×/g,'*').replace(/÷/g,'/').replace(/（/g,'(').replace(/）/g,')');
    if(!s||s.length>256)fail('表达式为空或过长。');
    if(!/^[\d.x+*/()\s-]+$/.test(s))fail('只使用数字、x、括号和 + - * /，不要输入其他字母或乘方。');
    const tokens=s.match(/(?:\d+(?:\.\d+)?|\.\d+)|[x+*/()-]/g)||[];
    if(tokens.join('')!==s.replace(/\s/g,''))fail('数字或小数点格式不正确。');
    if(tokens.length>120)fail('表达式过长。');
    let i=0,depth=0;
    function atom(){
      if(++depth>16)fail('括号嵌套太深。');
      const t=tokens[i++];let p;
      if(t==='+'||t==='-'){p=atom();if(t==='-')p=scale(p,rat(-1));}
      else if(t==='x')p=poly(O,Z);
      else if(t==='('){p=sum();if(tokens[i++]!==')')fail('括号没有配对。');}
      else if(t&&/^(?:\d|\.)/.test(t))p=poly(Z,rat(t));
      else fail('表达式缺少数字或括号。');
      depth--;return p;
    }
    function product(){
      let p=atom();
      while(i<tokens.length){
        let op=tokens[i];
        if(op==='*'||op==='/')i++;else if(op==='x'||op==='(')op='*';else break;
        const q=atom();
        if(op==='/'){if(q.a.n)fail('本章操作台不接受未知数作分母。');p=scale(p,div(O,q.b));}
        else {if(p.a.n&&q.a.n)fail('相乘后出现二次项，超出一元一次范围。');p=poly(add(mul(p.a,q.b),mul(q.a,p.b)),mul(p.b,q.b));}
      }return p;
    }
    function sum(){let p=product();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],q=product();p=plus(p,op==='-'?scale(q,rat(-1)):q);}return p;}
    const p=sum();if(i!==tokens.length)fail('表达式格式不完整。');return p;
  }
  function equation(s){const parts=String(s).split('=');if(parts.length!==2||!parts.every(p=>p.trim()))fail('方程需要且只能有一个等号。');return {left:parse(parts[0]),right:parse(parts[1]),raw:parts.map(p=>p.trim())};}
  function format(p){
    let s='';if(p.a.n)s=eq(p.a,O)?'x':eq(p.a,rat(-1))?'-x':str(p.a)+'x';
    if(p.b.n)s+=(s?(p.b.n<0n?' - ':' + '):p.b.n<0n?'-':'')+str(fraction(abs(p.b.n),p.b.d));return s||'0';
  }
  function solve(s){const {left:l,right:r}=equation(s),a=sub(l.a,r.a),b=sub(r.b,l.b);return !a.n?{kind:b.n?'none':'identity'}:{kind:'unique',value:div(b,a)};}
  function equivalent(s,t){const a=solve(s),b=solve(t);return a.kind===b.kind&&(a.kind!=='unique'||eq(a.value,b.value));}
  function transform(s,op,arg=''){
    const e=equation(s);let {left,right}=e;let preview;
    if(op==='simplify')preview='合并或展开两边，但不改变任何一边的值。';
    else if(op==='add'||op==='sub'){
      const p=parse(arg);if(!p.a.n&&!p.b.n)fail('加减0不会让方程前进一步，请选择有作用的操作。');
      const change=op==='sub'?scale(p,rat(-1)):p;left=plus(left,change);right=plus(right,change);
      const symbol=op==='sub'?'-':'+';preview=e.raw.map(x=>'('+x+') '+symbol+' ('+arg+')').join(' = ');
    }else if(op==='mul'||op==='div'){
      const p=parse(arg);if(p.a.n)fail('本章只允许两边同乘或同除一个非零常数。');
      if(!p.b.n)fail(op==='mul'?'两边乘0会丢失原方程的信息，不能作为等价求解步骤。':'不能除以0。');
      if(eq(p.b,O))fail('乘除1不会改变方程，请换一个操作。');
      const factor=op==='div'?div(O,p.b):p.b;left=scale(left,factor);right=scale(right,factor);
      preview=e.raw.map(x=>'('+x+') '+(op==='mul'?'×':'÷')+' ('+arg+')').join(' = ');
    }else fail('请选择合法操作。');
    return {left,right,preview,text:format(left)+' = '+format(right)};
  }
  function checkStep(s,op,arg,next){try{const t=transform(s,op,arg),n=equation(next);return {ok:same(t.left,n.left)&&same(t.right,n.right),message:'下一行必须准确表示你所选的这一步；检查两边、括号和每一项。',expected:t.text};}catch(e){return {ok:false,message:e.message};}}
  function evaluate(p,x){return add(mul(p.a,x),p.b);}
  function verify(original,value,left,right){try{const e=equation(original),x=rat(value),l=evaluate(e.left,x),r=evaluate(e.right,x);return eq(l,r)&&eq(l,rat(left))&&eq(r,rat(right));}catch{return false;}}
  function isIsolated(s){try{const e=equation(s),[l,r]=e.raw.map(x=>x.replace(/\s/g,''));if(l==='x'){rat(r);return true;}if(r==='x'){rat(l);return true;}return false;}catch{return false;}}
  function recurring(whole,pre,repeat){
    for(const s of [whole,repeat])if(!/^\d{1,6}$/.test(String(s)))fail('整数部分和循环节需要1到6位数字。');
    if(!/^\d{0,6}$/.test(String(pre)))fail('非循环部分最多6位数字。');
    const low=10n**BigInt(pre.length),high=low*10n**BigInt(repeat.length);
    const difference=BigInt(whole+pre+repeat)-BigInt(whole+pre);
    return {low:str(fraction(low)),high:str(fraction(high)),coefficient:str(fraction(high-low)),difference:String(difference),value:fraction(difference,high-low)};
  }
  function tariff(s){let q=rat(s);if(q.n<0n)fail('用量不能为负。');let total=Z;
    for(const [limit,rate]of [[10,2],[10,3]]){const chunk=q.n>BigInt(limit)*q.d?rat(limit):q;total=add(total,mul(chunk,rat(rate)));q=sub(q,chunk);}
    return add(total,mul(q,rat(5)));
  }
  const lever=(ln,ld,rn,rd)=>Math.sign(ln*ld-rn*rd);
  globalThis.EquationMath=Object.freeze({rat,add,sub,mul,div,eq,str,neg,parse,equation,format,solve,equivalent,transform,checkStep,evaluate,verify,isIsolated,recurring,tariff,lever});
})();

(() => {

  function removePreview(board,leftIds,rightIds){try{const p=removePlan(board,leftIds,rightIds);return p.mode==='all'?{ok:true,text:'两边一起拿走 '+E.format(p.amount),note:''}:{ok:true,text:'两边各拿走 '+label(p.amount),note:(p.big==='left'?'左边 ':'右边 ')+label(p.bigToken)+' 留下 '+label(p.rest)};}catch(e){return {ok:false,text:e.message,note:''};}}

  function addAmount(value){const r=R(value);need(r.n>0n,'数量必须大于0；正负号由方块决定。');need(r.n<=10000n*r.d,'每块数量不能超过10000。');const text=E.str(r);need(text.length<=32,'数量太精细，请使用更简单的分数。');return text;}

  function cancel(board,side,id,target){ready(board);const b=copy(board),a=get(b,side,id),c=get(b,side,target);need(id!==target&&a.kind!=='group'&&a.kind===c.kind,'只有同一盘中同类且符号相反的两块才能抵消。');need(!E.add(R(a.value),R(c.value)).n,'这两块大小不同，不能组成零对。');b[side]=b[side].filter(t=>t.id!==id&&t.id!==target);b.last=label(a)+' 与 '+label(c)+' 是零对，在同一盘内抵消。';return b;}

(() => {

function verify(q){return [stage('value','先填你求出的 x'),stage('sides','同时代入原式两边，比较计算结果',['leftValue','rightValue'],q.type==='word'?'':'verify'),...(q.type==='word'?[stage('reality','回到题目，答案有实际意义吗？',undefined,'verify')]:[])];}
function steps(q,s){

 if(q.type==='substitute')return [stage('trial','先试一个数，观察两边',['guess']),...verify(q)];
 if(q.type==='decimal')return [stage('align','移动两行小数点，让尾巴一样',['high','low']),stage('coefficient','相减后还剩多少个 x？'),stage('difference','右边的整数相减是多少？'),stage('fraction','用整数差除以系数，再约分',undefined,'decimal')];
 if(q.type==='tariff')return [stage('explore','先看看每一档怎样累计收费',['exploreUsage']),stage('segment','账单落在哪个费用区间？'),stage('billEquation','只把新增用量按新价格计算'),stage('usage','解出的用量还在这一档吗？',undefined,'tariff')];
 if(q.type==='lever')return [stage('observe','点击刻度，把右边重物移一移',['distance']),stage('leverEquation','怎样把数量与距离连成方程？'),stage('leverAnswer','算出距离，再代回两边检查',undefined,'lever')];
 throw Error('此活动暂未配置学习步骤。');
}
function context(q,s){return JSON.stringify([q.id,s.modelBuilt===true,s.history?.at(-1)?.equation||'',s.aligned===true]);}
function signature(q,s,ls,i){return JSON.stringify([context(q,s),ls.slice(0,i+1).flatMap(x=>x.fields.map(k=>[k,d(s,k)])),s.flowExplored===true,s.propertySeen===true]);}
function restore(raw){if(raw==null)return {passed:[]};need(raw&&Array.isArray(raw.passed)&&raw.passed.length<=20,'分步记录不正确。');return {passed:raw.passed.map(x=>{need(x&&typeof x.id==='string'&&/^[a-zA-Z][a-zA-Z0-9]{0,30}$/.test(x.id)&&typeof x.signature==='string'&&x.signature.length<12000,'分步记录不正确。');return {id:x.id,signature:x.signature};})};}
function current(q,s){const ls=steps(q,s),saved=restore(s.flow).passed;let index=0;for(;index<ls.length-1;index++){if(saved[index]?.id!==ls[index].id||saved[index]?.signature!==signature(q,s,ls,index))break;}return {...ls[index],index,total:ls.length};}
function validate(q,s,step){const id=step.id,v=d(s,id);
 if(id==='solve')need(solved(q,s),'先让 x 单独留下，再检验。');
 else if(id==='choice')need(v===q.answer,'先看题目条件，再选一张卡片。这个判断还不正确。');
 else if(id==='reason')need(v===q.reason,'判断对了，但这个理由还不对应。再检查等号、未知数和次数。');
 else if(id==='property')need(s.propertySeen,'先点击一次实验按钮，观察变化。');
 else if(id==='compare')need(!!s.comparison,'先点击一个时长，比较这次两种费用。');
 else if(id==='flowOrder')need(v==='0,1,2,3','先从实际问题出发，再找数量关系、求解，最后回到现实检验。');
 else if(id==='definition')need(v===q.definition,'x应该表示题目中需要求出的一个量，还要有单位。');
 else if(/^quantity\d+$/.test(id)){const f=q.fields[Number(id.slice(8))];need(expression(v,f.answer),'“'+f.label+'”还没表示正确，检查题目中的倍数、总量与单位。');}
 else if(id==='relation')need(v===q.relation,'这个相等关系没有连接题目中的数量，请再看“总共、相同、配套”等条件。');
 else if(id==='modelEquation')need(E.equivalent(v,q.equation),'所列方程还没有表达刚才的相等关系。');
 else if(id==='trial')need(!!s.trial,'先填一个试验值，点击“放进去看看”。');
 else if(id==='value'){const e=E.equation(q.equation),x=E.rat(v);need(E.eq(E.evaluate(e.left,x),E.evaluate(e.right,x)),'这个数代回原式，两边还不一样。重新检查求解或试值。');}
 else if(id==='sides'){const e=E.equation(q.equation),x=E.rat(d(s,'value'));for(const side of ['left','right'])need(numeric(d(s,side+'Value'),E.str(E.evaluate(e[side],x))),'原式'+(side==='left'?'左':'右')+'边的代入结果未填写或计算不正确，请检查对应栏的负号和括号。');}
 else if(id==='reality')need(v===q.reality,'再看数量能否为分数、范围和单位是否合理，不能随意四舍五入。');
 else if(id==='align'){const hi=Number(d(s,'high')),lo=Number(d(s,'low'));need([1,10,100,1000].includes(hi)&&[1,10,100,1000].includes(lo)&&hi>lo&&s.aligned&&Math.log10(lo)>=q.pre.length&&(Math.log10(hi)-Math.log10(lo))%q.repeat.length===0,'先移动并观察，让小数点后的循环尾巴完全一样。');}
 else if(['coefficient','difference','fraction'].includes(id)){const co=E.sub(E.rat(d(s,'high')),E.rat(d(s,'low'))),value=E.recurring(q.whole,q.pre,q.repeat).value,expected=id==='coefficient'?co:id==='difference'?E.mul(co,value):value;need(numeric(v,E.str(expected)),'这一步还没有算对，看看两行相减时什么保留下来。');if(id==='fraction')need(v.replace(/\s/g,'')===E.str(value),'数值正确，再把它写成最简分数。');}
 else if(id==='explore')need(s.flowExplored,'先点一个用量或拖动滑块，看看三档费用怎样累计。');
 else if(id==='segment'){const bill=E.rat(q.bill),seg=E.sub(bill,E.rat(20)).n<=0n?'1':E.sub(bill,E.rat(50)).n<=0n?'2':'3';need(v===seg,'先比账单与20元、50元两个界限。边界20属于第一档，50属于第二档。');}
 else if(id==='billEquation'){const seg=d(s,'segment'),eq=seg==='1'?'2x='+q.bill:seg==='2'?'20+3(x-10)='+q.bill:'50+5(x-20)='+q.bill;need(E.equivalent(v,eq),'已经用完的档位先累计，只有超过部分用新的单价。');}
 else if(id==='usage')need(E.rat(v).n>=0n&&numeric(E.str(E.tariff(v)),q.bill),'这个用量代入分档收费后，与账单不相同。');
 else if(id==='observe')need(s.observations?.length,'先点击一个刻度并记录观察。');
 else if(id==='leverEquation')need(E.equivalent(v,q.leftCount*q.leftDistance+'='+q.rightCount+'x'),'比较左边的数量×距离与右边的数量×距离。');
 else if(id==='leverAnswer')need(numeric(v,q.answer),'代回两侧的数量×距离，看看是否相等。');
 else throw Error('找不到这一步的检查方法。');
}
function confirm(q,s){const step=current(q,s);validate(q,s,step);const ls=steps(q,s),passed=restore(s.flow).passed.slice(0,step.index);passed.push({id:step.id,signature:signature(q,s,ls,step.index)});return {flow:{passed},action:step.action,index:step.index};}
function rewind(q,s){const at=current(q,s).index;return {passed:restore(s.flow).passed.slice(0,Math.max(0,at-1))};}
function invalidate(q,s,name){const ls=steps(q,s),at=ls.findIndex(x=>x.fields.includes(name));if(at>=0&&s.flow)s.flow.passed=s.flow.passed.slice(0,at);}
function prerequisites(q,s){const id=q.type==='substitute'?'trial':q.type==='balance'?'property':q.id==='d-plan-compare'?'compare':q.id==='e-flow'?'flowOrder':q.type==='tariff'?'explore':q.type==='decimal'?'align':q.type==='lever'?'observe':null;if(id)validate(q,s,{id});}
globalThis.LessonFlow=Object.freeze({steps,current,confirm,restore,rewind,invalidate,solved,validate,prerequisites});
})();

<script id="store-inline">
(() => {
  'use strict';
  const ids=new Set(EquationContent.items.map(q=>q.id)),limit=600000;
  const empty=()=>({drafts:{},history:[],notes:[],undo:[],hints:0,done:false,modelBuilt:false,observations:[]});
  function state(raw,nested=true){
    if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('学习记录格式不正确');
    const s=empty();
    s.drafts=Object.fromEntries(Object.entries(raw.drafts||{}).filter(([k,v])=>/^[a-zA-Z0-9]{1,40}$/.test(k)&&!['constructor','prototype'].includes(k)&&typeof v==='string'&&v.length<=512).slice(0,100));
    for(const [key,values]of [['high',['1','10','100','1000']],['low',['1','10','100','1000']]])if(s.drafts[key]&&!values.includes(s.drafts[key]))throw Error('实验倍率记录不正确');
    for(const [key,min,max]of [['exploreUsage',0,30]])if(s.drafts[key]!==undefined){const n=Number(s.drafts[key]);if(!Number.isInteger(n)||n<min||n>max)throw Error('实验范围记录不正确');}
    s.hints=Number.isInteger(raw.hints)?Math.max(0,Math.min(3,raw.hints)):0;s.done=raw.done===true;s.modelBuilt=raw.modelBuilt===true;
    if(Array.isArray(raw.history))s.history=raw.history.slice(-60).map(h=>{if(!h||typeof h.equation!=='string'||h.equation.length>256)throw Error('方程记录不合法');EquationMath.equation(h.equation);return {equation:h.equation,...(h.boardNotation!=null?{boardNotation:BalanceMath.restoreNotation(h.boardNotation,h.equation)}:{}),reason:String(h.reason||'').slice(0,256),kind:['add','sub','mul','div','simplify'].includes(h.kind)?h.kind:undefined};});
    for(const key of ['notes','observations'])if(Array.isArray(raw[key]))s[key]=raw[key].filter(t=>typeof t==='string').slice(-40).map(t=>t.slice(0,512));
    for(const key of ['preview','alignment','trial','experiment','comparison'])if(typeof raw[key]==='string')s[key]=raw[key].slice(0,1500);
    s.aligned=raw.aligned===true;s.written=raw.written===true;
    if(raw.flow!=null)s.flow=LessonFlow.restore(raw.flow);s.flowExplored=raw.flowExplored===true;s.propertySeen=raw.propertySeen===true;if(typeof raw.propertyResult==='string')s.propertyResult=raw.propertyResult.slice(0,1500);
    if(raw.balance!=null){if(!s.history.length)throw Error('天平缺少对应方程');s.balance=BalanceMath.restore(raw.balance,s.history.at(-1).equation);s.balanceWork=BalanceMath.restoreWork(raw.balanceWork,s.balance);}
    if(raw.feedback&&typeof raw.feedback.message==='string')s.feedback={message:raw.feedback.message.slice(0,1000),kind:['success','error','info'].includes(raw.feedback.kind)?raw.feedback.kind:'info'};
    if(nested&&Array.isArray(raw.undo))s.undo=raw.undo.slice(-5).map(u=>state(u,false));
    return s;
  }
  function sanitize(raw){if(!raw||raw.version!==1||!raw.states||typeof raw.states!=='object'||Array.isArray(raw.states))throw Error('记录版本或结构不正确');return {version:1,current:ids.has(raw.current)?raw.current:'home',states:Object.fromEntries(Object.entries(raw.states).filter(([id])=>ids.has(id)).map(([id,s])=>[id,state(s)]))};}
  function encode(db){const safe=sanitize(db);let text=JSON.stringify(safe),trimmed=false;if(text.length>limit){for(const s of Object.values(safe.states))s.undo=[];text=JSON.stringify(safe);trimmed=true;}if(text.length>limit)throw Error('学习记录过大，本次未覆盖旧存档。请导出记录后再清理。');return {text,trimmed};}
  function decode(raw){if(typeof raw!=='string'||raw.length>2000000)throw Error('旧记录过大，已保留原始内容，未覆盖。');return sanitize(JSON.parse(raw));}
  globalThis.EquationStore=Object.freeze({empty,encode,decode,limit});
})();

  function act(action,side){if(busy)return;try{
    if(action==='swap'){clearPicks();const next=B.swap(board),nextWork=work?.type==='expand'?{...work,side:work.side==='left'?'right':'left'}:work;work=B.restoreWork(nextWork,next);selected=null;commit(next);return;}

  }catch(e){show(e.message);}}

    return '<section class="balance-result" '+(q?'id="balance-lab" data-result-only="true"':'')+' aria-label="保留的天平求解结果"><div class="balance-result-caption">求解结果 · '+esc(pretty(B.displayEquation(b)))+'<small>这是刚才操作后的盘面；下面仍要检验原方程。</small></div>'+(q?'<div class="result-actions">'+swapButton(b)+'</div>':'')+'<div class="balance-scene">'+metalFrame(0,'result')+'<div class="balance-pans">'+['left','right'].map(side=>'<section class="balance-pan" data-result-pan="'+side+'" '+(q?'data-pan="'+side+'" data-bdrop="pan" data-side="'+side+'"':'')+'><div class="pan-label">'+(side==='left'?'左盘':'右盘')+'</div><div class="pan-blocks">'+(b[side].map(t=>block(t,side)).join('')||'<span class="empty-pan">0 · 空盘</span>')+'</div><div class="metal-pan-rim" aria-hidden="true"></div></section>').join('')+'</div></div>'+(q?'<div class="balance-message" id="balance-message" aria-live="polite">'+esc(message||'仍可把同盘同类块拖到一起合并，也可左右对调；代回原方程检验后才算完成。')+'</div>':'')+'</section>';
  }
  globalThis.BalanceView=Object.freeze({draw,mount,result,reset,isBusy:()=>busy,hasWork:()=>!!work});
})();

<script id="beginner-inline">
(() => {
  'use strict';
  const LEVELS=Object.freeze([
    Object.freeze({title:'让袋子单独留下',bags:1,left:2,right:5,equation:'x + 2 = 5'}),
    Object.freeze({title:'两个一样重的袋子',bags:2,left:0,right:6,equation:'2x = 6'}),
    Object.freeze({title:'这一次，你来想办法',bags:2,left:2,right:8,equation:'2x + 2 = 8'})

  const need=(ok,message)=>{if(!ok)throw Error(message);};
  const integer=(n,min,max)=>Number.isInteger(n)&&n>=min&&n<=max;
  const copy=s=>structuredClone(s);
  function create(level=0){need(integer(level,0,2),'关卡不存在。');return {level,phase:'balance',removed:0,selected:{left:[],right:[]},groups:[0,0],guess:'',hints:[0,0,0],done:[false,false,false],paperDone:false,paperHint:false,undo:[]};}

  function restore(raw,nested=true){
    if(raw==null){need(nested,'撤销记录不正确。');return create();}
    need(raw&&typeof raw==='object'&&!Array.isArray(raw)&&integer(raw.level,0,2),'入门记录格式不正确。');
    const s=create(raw.level),q=LEVELS[s.level];
    need(['balance','groups','answer','check','done','paper','finish'].includes(raw.phase),'入门步骤不正确。');s.phase=raw.phase;
    need(integer(raw.removed,0,q.left),'拿走的数量不正确。');s.removed=raw.removed;
    need(Array.isArray(raw.groups)&&raw.groups.length===2&&raw.groups.every(n=>integer(n,0,q.right))&&raw.groups[0]+raw.groups[1]<=q.right-s.removed,'分组记录不正确。');s.groups=[...raw.groups];
    need(raw.selected&&typeof raw.selected==='object','点选记录不正确。');const b=board(s);
    for(const side of ['left','right']){const ids=raw.selected[side];need(Array.isArray(ids)&&ids.length<=8&&ids.every(id=>b[side].includes(id))&&new Set(ids).size===ids.length,'选中的砝码不在盘中。');s.selected[side]=[...ids];}
    need(typeof raw.guess==='string'&&/^\d{0,2}$/.test(raw.guess),'答案记录不正确。');s.guess=raw.guess;
    need(Array.isArray(raw.hints)&&raw.hints.length===3&&raw.hints.every(n=>integer(n,0,3)),'提示记录不正确。');s.hints=[...raw.hints];
    need(Array.isArray(raw.done)&&raw.done.length===3&&raw.done.every(v=>typeof v==='boolean'),'完成记录不正确。');s.done=[...raw.done];s.paperDone=raw.paperDone===true;s.paperHint=raw.paperHint===true;
    if(s.phase!=='balance')need(!s.selected.left.length&&!s.selected.right.length,'当前步骤不应有选中砝码。');
    if(s.phase==='balance')need(s.groups.every(n=>n===0)&&s.guess==='','盘面步骤不一致。');
    if(s.phase==='groups')need(q.bags===2&&s.removed===q.left&&s.guess==='','还不能平均分。');
    if(['answer','check','done','paper','finish'].includes(s.phase)){
      need(s.removed===q.left,'袋子旁还有砝码。');
      need(q.bags===1?s.groups.every(n=>n===0):s.groups[0]===s.groups[1]&&s.groups[0]+s.groups[1]===q.right-s.removed,'两组还没有分完。');
    }
    if(['check','done'].includes(s.phase))need(q.bags*Number(s.guess)+q.left===q.right,'检验记录不正确。');
    if(['paper','finish'].includes(s.phase))need(s.level===2&&s.done[2],'还没有进入独立小题。');
    if(s.phase==='finish'&&s.paperDone)need(s.guess==='5','独立小题答案不正确。');
    if(s.phase==='done')need(s.done[s.level],'完成步骤缺少记录。');
    if(nested){need(Array.isArray(raw.undo)&&raw.undo.length<=8,'撤销记录过长。');s.undo=raw.undo.map(u=>{const previous=restore(u,false);need(previous.level===s.level,'撤销记录与关卡不一致。');return previous;});}
    return s;
  }
  function remember(s){const snapshot=copy({...s,undo:[]});s.undo.push(snapshot);s.undo=s.undo.slice(-8);}

    if(action==='undo'){
      if(s.selected.left.length||s.selected.right.length){s.selected={left:[],right:[]};return s;}
      need(s.undo.length,'还没有需要退回的动作。');const previous=s.undo.pop();previous.undo=s.undo;previous.hints=previous.hints.map((n,i)=>Math.max(n,s.hints[i]));previous.paperHint=previous.paperHint||s.paperHint;return previous;
    }

    if(action==='select'){
      need(s.phase==='balance','这一步不用选砝码。');need(['left','right'].includes(data.side)&&b[data.side].includes(data.id),'请选择盘里黄色的1克砝码。');
      const ids=s.selected[data.side];s.selected[data.side]=ids.includes(data.id)?ids.filter(id=>id!==data.id):[...ids,data.id];return s;
    }

      need(s.phase==='balance','这一步不用拿走砝码。');const l=s.selected.left.length,r=s.selected.right.length;
      need(l>0&&r>0,'两边各选一些黄色砝码，再一起拿走。');need(l===r,'左边选了'+l+'个，右边选了'+r+'个。两边要拿走一样多。');
      s.selected={left:[],right:[]};remember(s);s.removed+=l;if(s.removed===q.left&&q.bags===1)s.phase='answer';return s;

    if(action==='group'){
      need(s.phase==='balance'&&q.bags===2,'现在不用分两份。');need(s.removed===q.left,'袋子旁还有砝码。先从两边拿走一样多，让袋子单独留下。');

    }
    if(action==='give'||action==='return'){
      need(s.phase==='groups'&&integer(data.bin,0,1),'请选择一个袋子的格子。');
      if(action==='give')need(s.groups[0]+s.groups[1]<b.right.length,'砝码分完了。想调整，可以点格子里的砝码放回去。');
      else need(s.groups[data.bin]>0,'这个格子还没有砝码。');
      remember(s);s.groups[data.bin]+=action==='give'?1:-1;return s;
    }
    if(action==='group-confirm'){
      need(s.phase==='groups','先把砝码分两份。');need(s.groups[0]+s.groups[1]===b.right.length,'还有砝码剩在上面，把它们分完再看。');need(s.groups[0]===s.groups[1],'两个袋子一样重，每组也要一样多。点格子里的砝码可以放回去。');
      remember(s);s.phase='answer';return s;
    }
    if(action==='answer'||action==='paper-answer'){
      need(s.phase===(action==='answer'?'answer':'paper'),'先完成眼前的一步。');need(typeof data.value==='string'&&/^\d{1,2}$/.test(data.value),'在空格里填一个数，再试试看。');const value=Number(data.value);
      if(action==='answer'){const total=q.bags*value+q.left;need(total===q.right,'放回原来试试：左边是'+total+'克，右边是'+q.right+'克，还不一样。再看看一个袋子对应多少克。');remember(s);s.guess=String(value);s.phase='check';}
      else{need(value+3===8,'这个数加3还不是8，再试一个数。');s.guess=String(value);s.paperDone=true;s.phase='finish';s.undo=[];}return s;
    }
    if(action==='check'){need(s.phase==='check','先把你猜的重量放回去。');remember(s);s.phase='done';s.done[s.level]=true;return s;}
    if(action==='next'){
      need(s.phase==='done','先完成这一关。');if(s.level<2){const n=create(s.level+1);n.hints=s.hints;n.done=s.done;return n;}
      s.phase='paper';s.guess='';s.undo=[];return s;
    }
    if(action==='skip-paper'){need(s.phase==='paper','当前没有独立小题。');s.phase='finish';s.guess='';s.paperDone=false;return s;}
    if(action==='replay'){const n=create();n.hints=s.hints;n.paperHint=s.paperHint;return n;}
    throw Error('请使用画面里的按钮。');
  }
  globalThis.BeginnerMath=Object.freeze({LEVELS,create,board,restore,act});
})();

    const leftWeights=can?b.left.map(id=>weight('left',id,true)).join(''):Array.from({length:left},()=>weight('',0,false)).join('');

    return '<div class="intro-scale '+(check?'checking':'')+(distributing?' intro-distributing':'')+'"><svg class="intro-scale-frame" viewBox="0 0 900 330" preserveAspectRatio="none" aria-hidden="true"><path d="M450 40V285 M406 310L450 258L494 310Z" fill="#d0dcd7" stroke="#749086" stroke-width="5" stroke-linejoin="round"/><path d="M217 48H683" stroke="#617b73" stroke-width="12" stroke-linecap="round"/><circle cx="450" cy="48" r="11" fill="#ead6a2" stroke="#897442" stroke-width="3"/><path d="M217 48L78 247 M217 48L357 247 M683 48L543 247 M683 48L823 247" fill="none" stroke="#a6b8ad" stroke-width="2.5"/><path d="M385 315H515" stroke="#749086" stroke-width="8" stroke-linecap="round"/></svg><div class="intro-pan intro-left" data-intro-pan="left"><div class="intro-objects">'+leftItems+leftWeights+'</div><div class="intro-pan-base">左边'+(check?' · '+q.right+'克':'')+'</div></div><div class="intro-pan intro-right" data-intro-pan="right"><div class="intro-objects">'+rightWeights+'</div><div class="intro-pan-base">右边'+(check?' · '+q.right+'克':'')+'</div></div><span class="intro-level">两边一样重</span></div>';
  }
  function groups(){const remaining=M.LEVELS[state.level].right-state.removed-state.groups[0]-state.groups[1];return '<div class="intro-in-pan-groups"><div class="intro-pool"><div>'+Array.from({length:remaining},()=>weight('',0,false)).join('')+'</div><span>'+(remaining?'右盘还有 '+remaining+' 个未分组':'右盘总量没变，检查两份是否一样多')+'</span></div><div class="intro-bins">'+[0,1].map(i=>'<div class="intro-bin"><div class="intro-bin-heading"><span>第'+(i+1)+'组</span></div><div class="intro-bin-weights">'+Array.from({length:state.groups[i]},(_,j)=>button('return','<span>1<small>克</small></span>','intro-weight','data-bin="'+i+'" aria-label="把第'+(i+1)+'组的第'+(j+1)+'个砝码放回去"')).join('')+'</div>'+button('give','放入一个砝码','intro-give','data-bin="'+i+'" '+(!remaining?'disabled':''))+'</div>').join('')+'</div></div>';}
  function actionArea(){
    const s=state,l=s.selected.left.length,r=s.selected.right.length;
    if(s.phase==='balance'){
      if(M.LEVELS[s.level].bags===2&&s.removed===M.LEVELS[s.level].left)return button('group','分成两份','intro-primary');
      if(l||r)return '<span class="intro-count">左边选了 <b>'+l+'</b> 个 · 右边选了 <b>'+r+'</b> 个</span>'+button('remove','两边一起拿走','intro-primary')+'<span class="intro-micro">选中不改变重量</span>';
      return (s.level===2?button('group','分成两份','intro-secondary'):'')+'<span class="intro-micro">点黄色砝码开始，不需要拖动。</span>';
    }
    if(s.phase==='groups')return button('group-confirm','两边各留一份，看看吧','intro-primary');
    if(s.phase==='answer'||s.phase==='paper')return '<form id="intro-answer-form"><label for="intro-answer">'+(s.phase==='paper'?'x =':'一个袋子重')+'</label><input id="intro-answer" name="introAnswer" inputmode="numeric" autocomplete="off" maxlength="2" aria-label="'+(s.phase==='paper'?'x等于多少':'一个袋子重几克')+'" type="text" pattern="[0-9]{1,2}" required><span>'+(s.phase==='paper'?'':'克')+'</span><button type="submit" class="intro-primary" data-intro="'+(s.phase==='paper'?'paper-answer':'answer')+'">'+(s.phase==='paper'?'检查一下':'放回原来试试')+'</button></form>';
    if(s.phase==='check')return button('check','我数过了，两边一样重','intro-primary');
    if(s.phase==='done')return '<div class="intro-equation-note">'+(s.level===0?'袋子的重量也可以记作 <i>x</i>。':'用方程记下来：')+' <b>'+esc(M.LEVELS[s.level].equation)+' → x = '+s.guess+'</b></div>'+button('next',s.level===2?'试一道不画天平的小题':'下一关','intro-primary');
    if(s.phase==='finish')return button('replay','再玩一遍','intro-primary')+button('advanced','进入进阶练习','intro-secondary');
    return '';
  }
  function render(){
    const c=cue(),s=state,active=document.activeElement,previousFocus=active?.id,focusData=root.contains(active)&&active?.matches('[data-intro]')?{...active.dataset}:null;
    root.innerHTML='<div class="intro-shell"><header class="intro-header"><span class="intro-logo">方程平衡实验室 <small>PC · v1.3.17</small></span><div class="intro-steps" aria-label="三关进度">'+['一起拿走','平均分','自己试'].map((t,i)=>'<span '+(s.level===i?'aria-current="step"':'')+' class="'+(s.done[i]?'complete':'')+'">'+(i+1)+' '+t+'</span>').join('')+'</div>'+button('advanced','进阶练习','intro-link')+'</header><section class="intro-task"><div class="intro-kicker">'+(s.phase==='paper'?'最后一道小挑战':s.phase==='finish'?'今天的探索':M.LEVELS[s.level].title)+'</div><h1>小袋子有多重？</h1><div class="intro-prompt" aria-live="polite"><h2 id="intro-cue">'+esc(c.title)+'</h2><p>'+esc(c.detail||'每个黄色砝码都是1克。')+'</p></div></section><section class="intro-stage" aria-label="天平实验">'+(s.phase==='paper'?'<div class="intro-paper"><span>把今天的方法，用到新题里。</span><strong>x + 3 = 8</strong>'+(s.paperHint?'<p>想一想：两边都减去3，会剩下什么？</p>':'')+'</div>':s.phase==='finish'?'<div class="intro-finish"><b>两边一起拿走 → 平均分 → 放回去检验</b><p>完成游戏不代表已经学会。改天换一道新题，再自己试一次。</p><div>'+s.done.map((v,i)=>'<span>第'+(i+1)+'关 · '+(s.hints[i]?'用过提示':'未点提示')+'</span>').join('')+'</div><p>独立小题：'+(s.paperDone?(s.paperHint?'借助提示完成':'未点提示完成'):'暂时跳过')+'</p></div>':scale())+'</section><div class="intro-feedback" id="intro-feedback" role="status">'+esc(message)+'</div><section class="intro-actions">'+actionArea()+'</section><footer class="intro-footer"><div>'+button('undo','退一步','intro-link',(!s.undo.length&&!s.selected.left.length&&!s.selected.right.length?'disabled':''))+button('hint','给我一点帮助','intro-link')+button('speak','听一遍','intro-link',voice?'':'hidden')+'</div><span id="intro-storage" class="'+(warning?'intro-warning':'')+'">'+esc(warning||'进度只保存在这台电脑')+'</span><div>'+button('restart','重玩这关','intro-link')+button('download','下载离线版','intro-link')+'</div></footer>'+(s.phase==='paper'?button('skip-paper','先跳过这道小题','intro-skip'):'')+(warning?button('clear','清除入门记录后重新保存','intro-link danger'):'')+'</div><dialog id="intro-reset-dialog"><h2>清除三关入门记录？</h2><p>只清除这三关的进度，不影响进阶练习和旧游戏。</p>'+button('cancel-clear','保留记录')+button('confirm-clear','确认清除','danger')+'</dialog>';
    root.setAttribute('aria-busy',String(busy));
    if(c.target==='left'||c.target==='right')$('[data-intro-pan="'+c.target+'"] .intro-weight')?.classList.add('intro-cue-ring');
    if(c.target==='remove'||c.target==='group')$('[data-intro="'+c.target+'"]')?.classList.add('intro-cue-ring');
    if(s.phase==='answer'||s.phase==='paper')$('#intro-answer')?.focus({preventScroll:true});
    else if(previousFocus&&root.querySelector('#'+CSS.escape(previousFocus)))root.querySelector('#'+CSS.escape(previousFocus)).focus({preventScroll:true});
    else if(focusData){const same=[...root.querySelectorAll('[data-intro]:not(:disabled)')].find(b=>['intro','side','id','bin'].every(k=>b.dataset[k]===focusData[k]));(same||$('.intro-actions .intro-primary')||$('.intro-give:not(:disabled)')||$('.intro-weight:not(.static)'))?.focus({preventScroll:true});}
  }
  function persist(){if(locked)return;try{const text=JSON.stringify(M.restore(state));if(text.length>80000)throw Error('记录过长');localStorage.setItem(KEY,text);warning='';}catch{warning='暂时不能保存，但你仍然可以玩。原记录没有被覆盖。';}}
  function show(){document.body.classList.add('beginner-active');root.hidden=false;document.getElementById('app').hidden=true;try{sessionStorage.setItem(MODE,'beginner');}catch{}message='';render();window.scrollTo({top:0,behavior:'instant'});}
  function advanced(){if(busy)return;window.speechSynthesis?.cancel();document.body.classList.remove('beginner-active');root.hidden=true;document.getElementById('app').hidden=false;try{sessionStorage.setItem(MODE,'advanced');}catch{}window.scrollTo({top:0,behavior:'instant'});}
  async function run(action,data={}){
    if(busy)return;
    if(action==='advanced'){advanced();return;}
    if(action==='download'){const a=document.createElement('a');a.href=location.protocol==='file:'?location.href:'方程平衡实验室_离线版.html';a.download='equation-lab-offline.html';a.click();return;}
    if(action==='clear'){$('#intro-reset-dialog').showModal();return;}
    if(action==='cancel-clear'){$('#intro-reset-dialog').close();return;}
    if(action==='confirm-clear'){try{localStorage.removeItem(KEY);locked=false;warning='';state=M.create();persist();render();}catch{message='浏览器目前不允许保存。你仍然可以继续玩。';render();}return;}
    if(action==='speak'){if(voice){const c=cue(),u=new SpeechSynthesisUtterance(c.title+'。'+c.detail);u.voice=voice;u.lang='zh-CN';u.rate=.85;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}return;}
    if(action==='bag'){message='袋子里的重量还不知道。先看看旁边标着“1克”的黄色砝码。';render();return;}
    try{
      const next=M.act(state,action,data);message='';
      if(['remove','give','check'].includes(action)&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
        busy=true;root.setAttribute('aria-busy','true');root.classList.add('intro-busy');
        const nodes=action==='remove'?[...root.querySelectorAll('.intro-weight.chosen')]:action==='give'?[root.querySelector('.intro-pool .intro-weight')]:[root.querySelector('.intro-scale')];
        await Promise.all(nodes.filter(Boolean).map(node=>node.animate(action==='remove'?[{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(30px) scale(.8)'}]:action==='give'?[{opacity:1},{opacity:0,transform:'translateY(20px)'}]:[{opacity:.5},{opacity:1}],{duration:300,easing:'ease-in-out'}).finished));
      }
      state=next;persist();if(action==='hint'){message=state.phase==='paper'?'两边都减去3，试着自己算一算。':state.phase==='groups'?'两个格子最后要一样多；分错了，点里面的砝码放回去。':'先让袋子旁边没有砝码。两边拿走一样多，天平仍然平衡。';}
      render();
    }catch(error){message=error.message||'这一步没有完成，再试一次。';render();}
    finally{busy=false;root.classList.remove('intro-busy');root.setAttribute('aria-busy','false');}
  }
  function init(){
    root=document.getElementById('beginner-root');if(!root)return;
    try{const raw=localStorage.getItem(KEY);if(raw){if(raw.length>80000)throw Error('记录过长');state=M.restore(JSON.parse(raw));}}catch{locked=true;warning='入门记录未能读取，原记录已保留。本次可以玩，但不保存。';}
    const voices=()=>{voice=window.speechSynthesis?.getVoices().find(v=>v.localService&&/^zh/i.test(v.lang))||null;const b=$('[data-intro="speak"]');if(b)b.hidden=!voice;};voices();window.speechSynthesis?.addEventListener('voiceschanged',voices);
    root.addEventListener('click',e=>{const b=e.target.closest('[data-intro]');if(!b||b.disabled)return;e.preventDefault();const action=b.dataset.intro;run(action,{side:b.dataset.side,id:Number(b.dataset.id),bin:Number(b.dataset.bin),value:$('#intro-answer')?.value.trim()||''});});
    root.addEventListener('submit',e=>{if(e.target.id==='intro-answer-form'){e.preventDefault();run(state.phase==='paper'?'paper-answer':'answer',{value:$('#intro-answer').value.trim()});}});
    document.addEventListener('click',e=>{if(e.target.closest('[data-intro-open]')){e.preventDefault();show();}});
    document.addEventListener('keydown',e=>{if(!root.hidden&&busy)e.preventDefault();},true);
    let mode='beginner';try{mode=sessionStorage.getItem(MODE)||mode;}catch{}if(mode==='advanced')advanced();else show();
  }
  globalThis.BeginnerView=Object.freeze({init,show,isBusy:()=>busy});
})();

</script>
<script id="lesson-view-inline">
(() => {
'use strict';
const E=EquationMath,F=LessonFlow,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),pretty=v=>String(v).replace(/-/g,'−').replace(/\*/g,'×');
const val=(s,n,fall='')=>s.drafts?.[n]??fall;

function solver(q,s,ui){const current=s.history.at(-1)?.equation||q.equation,independent=q.mode==='independent',method=val(s,'solveMethod',independent?'write':'tiles'),op=val(s,'op'),board=method==='tiles'&&!independent?ui.balanceBoard(q,s):'',shown=board?BalanceMath.sceneEquation(s.balance):s.history.at(-1)?.boardNotation?BalanceMath.notationEquation(s.history.at(-1).boardNotation):current;let content=board?'':'<div class="equation-main" id="current-equation">'+esc(pretty(shown))+'</div>';
 if(!independent)content+='<div class="lesson-method">'+b('flow-tiles','用方块操作',method==='tiles'?'primary':'quiet')+b('flow-write','点按钮、写下一行',method==='write'?'primary':'quiet')+'</div>';
 if(method==='tiles'&&!independent){content+=board+'<p class="lesson-next-note">不必猜拖到哪里：分组可直接点；其他工具先点工具，再点目标。遇到大数或分数，也可切换上面的“点按钮、写下一行”。</p>';return content;}
 content+='<p class="lesson-next-note">'+(independent?'这关自己决定每一步，不自动给出结果。':'先选一个操作。两边会显示同样的动作，再由你算下一行。')+'</p>'+cards(s,'op','① 两边做什么？',[['add','两边加上…'],['sub','两边减去…'],['mul','两边乘以…'],['div','两边除以…'],['simplify','各自展开、合并']]);
 if(op){content+=(op==='simplify'?'<p>展开时要乘到括号里的每一项。合并时，x项和常数各算各的。</p>':input(s,'arg','② '+({add:'加上哪个数或式子？',sub:'减去哪个数或式子？',mul:'乘以哪个非零数？',div:'除以哪个非零数？'}[op]),op==='add'||op==='sub'?'例如 2 或 x':'也可以输入负数或分数')+keypad('arg'))+b('preview','在两边摆出这个操作','quiet');
 if(s.preview)content+='<div class="lesson-operation-pair" id="operation-preview"><span>'+esc(pretty(s.preview.split('=')[0]))+'</span><b>=</b><span>'+esc(pretty(s.preview.split('=').slice(1).join('=')))+'</span></div>';
 content+=input(s,'nextEquation','③ 算一算，写出下一行方程','左边 = 右边')+keypad('nextEquation')+b('step','核对这一步');}
 return content;
}
function property(q,s){const zero=q.id==='a-zero',div=q.id==='a-divzero';return '<div class="lesson-formula">'+(zero?'2x = 6':div?'x + 3 = 7':'x + 3 = 7')+'</div><p>'+esc(zero?'选一个x，再比较原式与两边乘0后的式子。':div?'试着把两边都除以0，看看为什么这不是合法运算。':'同样减3，只改左边和两边同时改，有什么不同？')+'</p><div class="lesson-quick">'+(zero?[2,3,4].map(n=>b('flow-property','试 x = '+n,'quiet','data-sample="'+n+'"')).join(''):div?b('flow-property','两边都除以0','quiet','data-sample="zero"'):b('flow-property','只让左边减3','quiet','data-sample="left"')+b('flow-property','让两边都减3','quiet','data-sample="both"'))+'</div><div class="lesson-observation">'+esc(s.propertyResult||'点一个实验按钮，变化会出现在这里。')+'</div><p class="muted">这是具体数值观察，不代替一般的等式性质。错误操作只在这个反例实验中展示，不写入求解步骤。</p>';}
function decimals(q,s,step){const hi=Number(val(s,'high','1')),lo=Number(val(s,'low','1'));const digits=power=>{let seq=q.whole+q.pre+q.repeat.repeat(10),cut=q.whole.length+power;return (seq.slice(0,cut).replace(/^0+(?=\d)/,'')||'0')+'.'+seq.slice(cut,cut+10)+'…';};const line=(name,n)=>'<div class="lesson-decimal-row"><span>'+n+'x</span><b>=</b><strong>'+esc(digits(Math.log10(n)))+'</strong><div>'+b('flow-shift','小数点右移一位 ×10','quiet','data-field="'+name+'" data-delta="1" '+(n>=1000?'disabled':''))+b('flow-shift','退回一位','quiet','data-field="'+name+'" data-delta="-1" '+(n<=1?'disabled':''))+'</div></div>';
 let html='<div class="lesson-known">原数 x = '+esc(q.whole+'.'+q.pre)+'<span class="overline">'+esc(q.repeat)+'</span>（横线部分一直重复）</div>';
 if(step.id==='align')return html+line('high',hi)+line('low',lo)+'<input type="hidden" name="high" value="'+hi+'"><input type="hidden" name="low" value="'+lo+'">'+b('align','比较两行的循环尾巴','quiet')+'<div class="lesson-observation">'+esc(s.alignment||'先点右移。要让小数点后的尾巴从同一位开始一样。')+'</div>';
 html+='<div class="lesson-formula">'+hi+'x = '+esc(digits(Math.log10(hi)))+'<br>− '+lo+'x = '+esc(digits(Math.log10(lo)))+'</div>';
 const prompt={coefficient:hi+' − '+lo+' = ?',difference:'尾巴消去，整数部分相减是多少？',fraction:'你已得到 '+esc(val(s,'coefficient'))+'x = '+esc(val(s,'difference'))+'。x 等于几分之几？'};return html+'<p>'+prompt[step.id]+'</p>'+input(s,step.id,{coefficient:'x的系数',difference:'整数差',fraction:'最简分数'}[step.id])+keypad(step.id);

function tariff(q,s,step){const use=Number(val(s,'exploreUsage','0')),a=Math.min(use,10),bb=Math.max(0,Math.min(use-10,10)),c=Math.max(0,use-20);const chart='<div class="lesson-tiers">'+[[a,2,'前10单位'],[bb,3,'超过10到20的部分'],[c,5,'超过20的部分']].map(([n,p,t])=>'<div><span>'+t+'</span><b>'+n+' × '+p+' = '+n*p+'元</b></div>').join('')+'</div>';const known='<div class="lesson-known">这题的账单：'+esc(q.bill)+'元；第一档用满20元，前两档用满50元。</div>';

function lever(q,s,step){if(step.id!=='observe')return '<div class="lesson-known">左边：'+q.leftCount+'个 × '+q.leftDistance+'格；右边：'+q.rightCount+'个 × x格。</div>'+input(s,step.id,step.id==='leverEquation'?'我的平衡方程':'右侧距离 x =（格）')+keypad(step.id);const raw=Number(val(s,'distance','2')),n=Number.isInteger(raw)&&raw>=1&&raw<=8?raw:2,sign=E.lever(q.leftCount,q.leftDistance,q.rightCount,n),lx=300-q.leftDistance*29,rx=300+n*29;return '<svg class="lesson-lever" viewBox="0 0 600 210" role="img" aria-label="可点击下方刻度移动右边重物"><path d="M280 183L300 87L320 183Z" fill="#a4b799"/><g style="transform:rotate('+(-sign*6)+'deg);transform-origin:300px 87px"><path d="M44 87H556" stroke="#5d7657" stroke-width="7"/>'+Array.from({length:17},(_,i)=>'<path d="M'+(68+i*29)+' 82v12" stroke="#c6d7b5"/>').join('')+'<path d="M'+lx+' 87v44 M'+rx+' 87v44" stroke="#637957"/><rect x="'+(lx-20)+'" y="130" width="40" height="33" rx="6" fill="#5b8060"/><rect x="'+(rx-20)+'" y="130" width="40" height="33" rx="6" fill="#b78c46"/><text x="'+lx+'" y="153" text-anchor="middle" fill="white">'+q.leftCount+'</text><text x="'+rx+'" y="153" text-anchor="middle" fill="white">'+q.rightCount+'</text></g></svg><p>右边放在哪个刻度？点一下，重物就移过去。</p><div class="lesson-ticks">'+Array.from({length:8},(_,i)=>b('flow-distance',(i+1)+'格',n===i+1?'primary':'quiet','data-value="'+(i+1)+'"')).join('')+'</div><input type="hidden" name="distance" value="'+n+'"><div class="lesson-observation">'+esc(s.observations?.at(-1)||'还没记录过。先点一个刻度。')+'</div><p class="muted">理想等重物体，均匀杆在中点支撑；不是只比较重物个数。</p>';}

 });root.addEventListener('keydown',event=>{if(event.key!=='Enter'||!event.target.matches('input:not([type=range])'))return;event.preventDefault();const id=root.dataset.flowStep,action=id==='trial'?'try':id==='compare'?'compare-plans':id==='solve'?(root.querySelector('.lesson-operation-pair')?'step':'preview'):'flow-next';adapter.action(action);});}

})();

      }else if(name==='step'){
        need(s.history.length<60,'本题步骤较多，可以重开后选更直接的路线。');const current=s.history.at(-1)?.equation;need(current,'请先列方程。');const next=draft('nextEquation'),op=draft('op'),arg=draft('arg'),r=E.checkStep(current,op,arg,next);need(r.ok,r.message);if(q.mode!=='independent')BalanceMath.restore(BalanceMath.create(next),next);
        need(next.replace(/\s/g,'')!==current.replace(/\s/g,''),'这一行还没有变化，请写出整理后的方程或换一个操作。');checkpoint();s.history.push({equation:next,kind:op,reason:op==='simplify'?'分别整理两边':'两边同'+({add:'加',sub:'减',mul:'乘',div:'除'}[op])+' ('+arg+')'});s.balance=null;s.balanceWork=null;BalanceView.reset();s.drafts.nextEquation='';s.preview='';s.feedback={kind:'success',message:'这一步有依据，两边都核对正确。'};s.done=false;justStepped=true;
      }else if(name==='verify'){
        if(s.balance)need(BalanceMath.finishable(s.balance),'先在天平中消去零对和多余项，让x单独留下。');
        if(q.type!=='substitute')need(s.history.length&&E.isIsolated(s.history.at(-1).equation),'先通过合法步骤让x单独留下，再检验。');need(E.verify(q.equation,draft('value'),draft('leftValue'),draft('rightValue')),'解或原方程两边的代入值不正确。请分别计算原式的左边和右边。');
        if(q.type==='word')need(draft('reality')===q.reality,'还要检验实际意义：数量能否为分数，范围、单位是否符合题意？');checkpoint();s.notes.push('x='+draft('value')+'代回原式：左边='+draft('leftValue')+'，右边='+draft('rightValue'));mark(q.type==='word'?q.realityNote:'解已代回原方程，两边相等。');
      }else if(name==='align'){
        const hi=Number(draft('high')),lo=Number(draft('low'));need([1,10,100,1000].includes(hi)&&[1,10,100,1000].includes(lo),'请先选两行的倍率。');need(hi>lo,'上行倍率应大于下行，方便相减。');const highPower=Math.log10(hi),lowPower=Math.log10(lo);checkpoint();s.aligned=lowPower>=q.pre.length&&(highPower-lowPower)%q.repeat.length===0;s.alignment=s.aligned?'循环尾部已对齐。请自己计算相减后的系数、整数差和最简分数。':'尾部还没对齐：先移过非循环部分，再移动完整循环节。';s.done=false;
      }else if(name==='decimal'){
        need(s.aligned,'请先选择两行倍率，并使循环尾部对齐。');const hi=E.rat(draft('high')),lo=E.rat(draft('low')),co=E.sub(hi,lo),value=E.recurring(q.whole,q.pre,q.repeat).value,diff=E.mul(co,value);need(exact(draft('coefficient'),E.str(co)),'两行相减后，x的系数没有算对。');need(exact(draft('difference'),E.str(diff)),'右边整数部分的差没有算对。');need(exact(draft('fraction'),E.str(value)),'请用整数差除以系数，再约分。');need(draft('fraction').replace(/\s/g,'')===E.str(value),'数值正确，请写成最简分数。');checkpoint();s.notes.push(E.str(co)+'x='+E.str(diff)+'，x='+E.str(value));mark('无限循环尾部相同，精确相减得到最简分数。');
      }else if(name==='tariff'){
        const usage=E.rat(draft('usage'));need(usage.n>=0n,'用量不能是负数。');const n=Number(usage.n)/Number(usage.d),segment=n<=10?'1':n<=20?'2':'3';need(draft('segment')===segment,'求出的用量不属于所选区间，请先核对档位。');const expected=segment==='1'?'2x='+q.bill:segment==='2'?'20+3(x-10)='+q.bill:'50+5(x-20)='+q.bill;need(E.equivalent(draft('billEquation'),expected),'分段方程不正确。已经用完的档位按各自价格累加。');need(E.eq(E.tariff(draft('usage')),E.rat(q.bill)),'用量代回实际计费规则，与账单不符。');checkpoint();s.notes.push(draft('billEquation')+'；用量'+draft('usage')+'，总费'+q.bill+'元');mark('方程、用量区间和实际账单三重核验通过。');
      }else if(name==='lever-record'){
        const distance=Number(draft('distance','2'));need(Number.isInteger(distance)&&distance>=1&&distance<=8,'实验距离用1到8的整数格。');checkpoint();const left=q.leftCount*q.leftDistance,right=q.rightCount*distance;s.observations.push('左 '+q.leftCount+'×'+q.leftDistance+'='+left+'；右 '+q.rightCount+'×'+distance+'='+right+' → '+(left===right?'平衡':left>right?'左侧下沉':'右侧下沉'));s.observations=s.observations.slice(-20);
      }else if(name==='lever'){
        need(s.observations.length,'请先调整距离，记录至少一次实验。');need(E.equivalent(draft('leverEquation'),q.leftCount*q.leftDistance+'='+q.rightCount+'x'),'平衡条件必须比较数量与距离的乘积。');need(exact(draft('leverAnswer'),q.answer),'距离还不正确，把它代回两边的乘积检查。');checkpoint();s.notes.push(draft('leverEquation')+'，右侧距离'+draft('leverAnswer')+'格');mark('方程和两侧作用已核验。在模型前提下木杆平衡。');
      }
      save();render();
    }catch(error){feedback(error.message);}
  }
  for(const type of ['click','submit','keydown','input','change'])document.addEventListener(type,event=>{if(BalanceView.isBusy()){event.preventDefault();event.stopImmediatePropagation();}},true);
  document.addEventListener('click',event=>{
    const go=event.target.closest('[data-go]');if(go){navigate(go.dataset.go);return;}
    const zone=event.target.closest('[data-zone]');if(zone){zone.nextElementSibling.hidden=!zone.nextElementSibling.hidden;return;}
    const term=event.target.closest('[data-term]');if(term){prepareMove(term.dataset.term,term.dataset.side);return;}
    const target=event.target.closest('[data-action]');if(target){event.preventDefault();action(target.dataset.action,target.dataset);}
    if(event.target.closest('.brand')){event.preventDefault();navigate('home');}
  });
  document.addEventListener('submit',event=>{const f=event.target.closest('[data-submit]');if(f){event.preventDefault();action(f.dataset.submit);}});
  function changed(event){const field=event.target;if(!field.closest('#workspace')||!field.name||!qnow())return;const s=snow(),value=field.value.slice(0,512);if(s.drafts[field.name]===value){if(field.name==='exploreUsage'&&event.type==='change'&&s.drafts.fullForm!=='yes'){save();render();}return;}s.drafts[field.name]=value;s.done=false;s.feedback=null;
    if(['op','arg'].includes(field.name)){s.preview='';if($('operation-preview'))$('operation-preview').hidden=true;}
    if(['high','low'].includes(field.name)){s.aligned=false;s.alignment='';document.querySelector('.aligned-lines')?.remove();}
    if($('completion'))$('completion').hidden=true;if($('feedback'))$('feedback').hidden=true;
    LessonFlow.invalidate(qnow(),s,field.name);if(field.name==='guess')s.trial='';if(field.name==='compareHours')s.comparison='';
    if(field.name==='exploreUsage'){s.flowExplored=true;if(s.drafts.fullForm!=='yes'&&event.type==='change'){save();render();return;}if($('water-output'))updateWater();}save();renderNav();
  }
  document.addEventListener('input',changed);document.addEventListener('change',changed);
  function prepareMove(term,side){const s=snow();try{const current=s.history.at(-1).equation,e=E.equation(current);const p=E.parse(term),source=e[side];need(s.history.filter(h=>h.kind==='add'||h.kind==='sub').length>=2,'先完成两次同步加减。');need((p.a.n&&E.eq(p.a,source.a)&&!p.b.n)||(!p.a.n&&E.eq(p.b,source.b)),'只能移动当前一边的完整项。');s.drafts.op='sub';s.drafts.arg=term;s.preview=E.transform(current,'sub',term).preview;s.feedback={kind:'info',message:'移项背后是两边同减这个完整项。请自己计算并确认下一行。'};save();render();}catch(e){feedback(e.message);}}
  document.addEventListener('dragstart',event=>{const t=event.target.closest('[data-term]');if(t)event.dataTransfer.setData('application/json',JSON.stringify({term:t.dataset.term,side:t.dataset.side}));});
  document.addEventListener('dragover',event=>{const target=event.target.closest('[data-drop-side]');if(target){event.preventDefault();target.classList.add('drag-over');}});
  document.addEventListener('dragleave',event=>event.target.closest('[data-drop-side]')?.classList.remove('drag-over'));
  document.addEventListener('drop',event=>{const target=event.target.closest('[data-drop-side]');if(!target)return;event.preventDefault();target.classList.remove('drag-over');try{const data=JSON.parse(event.dataTransfer.getData('application/json'));if(data.side!==target.dataset.dropSide&&['left','right'].includes(data.side)&&typeof data.term==='string'&&data.term.length<40)prepareMove(data.term,data.side);}catch{feedback('只移动当前方程里的项。');}});
  try{render();}catch(error){storageLocked=true;storageWarning='旧记录中的页面无法恢复，原始存档已保留。本次可继续练习但不保存。';db={version:1,current:'home',states:{}};render();}
  BeginnerView.init();
})();

</script>
