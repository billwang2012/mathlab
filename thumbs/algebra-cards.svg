<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="代数叠叠卡示意图：3x 的黑卡与 −2x 的红卡叠合抵消，得到 x">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".35"/></filter>
    <g id="black"><rect width="18" height="18" rx="3" fill="#1f2328"/><text x="9" y="13.5" text-anchor="middle" font-size="12" font-style="italic" fill="#f6efe0">x</text></g>
    <g id="red"><rect width="18" height="18" rx="3" fill="#d84a3a"/><text x="9" y="13.5" text-anchor="middle" font-size="12" font-style="italic" fill="#fff4ec">x</text></g>
  </defs>
  <rect width="320" height="200" fill="#1b3140"/>
  <circle cx="290" cy="20" r="70" fill="#24465b" opacity=".6"/>
  <g font-family="system-ui,'PingFang SC','Noto Sans CJK SC',sans-serif">
    <g transform="translate(26 40) rotate(-7)" filter="url(#s)">
      <rect width="92" height="112" rx="10" fill="#f6efe0" stroke="#d9cdb4"/>
      <use href="#black" x="10" y="32"/><use href="#black" x="34" y="32"/><use href="#black" x="10" y="56"/>
      <text x="12" y="22" font-size="15" font-weight="700" fill="#1f2328">3x</text>
      <text x="10" y="98" font-size="12" fill="#7a6e58">积分 5</text>
    </g>
    <g transform="translate(96 50) rotate(6)" filter="url(#s)">
      <rect width="92" height="112" rx="10" fill="#fbe9e4" stroke="#e7b9ae"/>
      <use href="#red" x="23" y="34"/><use href="#red" x="50" y="34"/>
      <text x="46" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#b8392b">−2x</text>
      <text x="46" y="96" text-anchor="middle" font-size="12" fill="#9b6b5f">积分 −2</text>
    </g>
    <path d="M200 106h30" stroke="#f1cd6f" stroke-width="3.5" stroke-linecap="round"/><path d="M226 98l10 8-10 8" fill="none" stroke="#f1cd6f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(244 52)" filter="url(#s)">
      <rect width="62" height="100" rx="10" fill="#f6efe0" stroke="#f1cd6f" stroke-width="2"/>
      <use href="#black" x="22" y="40"/>
      <text x="31" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">x</text>
      <text x="31" y="86" text-anchor="middle" font-size="12" fill="#7a6e58">积分 3</text>
    </g>
    <text x="160" y="188" text-anchor="middle" font-size="15" fill="#cfe0ea">3x + (−2x) = x</text>
  </g>
</svg>
